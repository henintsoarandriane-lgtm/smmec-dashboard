<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Trois hexagones SMMEC -->
  <g fill="none" stroke-width="18" stroke-linejoin="round">
    <!-- Hexagone jaune (haut) -->
    <polygon points="200,80 260,115 260,185 200,220 140,185 140,115"
             stroke="#F5B041" />
    <!-- Hexagone rouge (bas-gauche) -->
    <polygon points="140,220 200,255 200,325 140,360 80,325 80,255"
             stroke="#C0392B" />
    <!-- Hexagone gris (bas-droite) -->
    <polygon points="260,220 320,255 320,325 260,360 200,325 200,255"
             stroke="#5A5A5A" />
  </g>
  <!-- Texte SMMEC -->
  <text x="200" y="430" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="800"
        font-size="64" fill="#C0392B" letter-spacing="4">SMMEC</text>
  <text x="200" y="460" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="500"
        font-size="11" fill="#5A5A5A">Société Malagasy Mutualiste d'Épargne et de Crédit</text>
</svg>